<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#B0ABFF" />
    <title>NJZ Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-section">
        <div class="login-content">
          <div class="title">
            <h1>
              <img src="./images/njz-logo.png" alt="Newjeans" />
            </h1>
            <p class="slogan">
              Even if we're not NewJeans anymore, <br />
              NewJeans never die
            </p>
          </div>
          <div class="login-form">
            <form>
              <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder=" " />
              </div>
              <div class="field">
                <label for="password">Password:</label>
                <input
                  type="password"
                  id="password"
                  placeholder=" "
                />
              </div>
              <button type="submit">Log in</button>
            </form>
          </div>
        </div>
      </div>
      <div class="decorative-right">
        <img src="./images/bunnies.png" alt="" />
      </div>
    </div>
  </body>
</html>
